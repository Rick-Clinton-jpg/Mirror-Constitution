[project]
name = "mirror-constitution"
version = "0.1.0"
description = "Executable containment invariants for agent sandboxes: Authority Monotonicity, Mirror Weave, Confidentiality Monotonicity, Evaluator-Trust Integrity, Channel Non-Emergence, and Chainmail."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mirror_constitution*"]
