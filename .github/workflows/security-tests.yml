name: Security regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-containment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp2 util-linux
          python -m venv .venv
          .venv/bin/python -m pip install -e . pytest==8.4.2
          # The bootstrap and test agents execute after dropping to uid 65534.
          # Preserve owner-only writes while making public source readable.
          chmod o+x /home/runner
          chmod -R a+rX mirror_constitution examples
          namei -l "$PWD/mirror_constitution/sandbox/kernel_lockdown.py"
      - name: Require actual kernel enforcement and run all regressions
        run: |
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            "$PWD/.venv/bin/python" scripts/check_kernel.py
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            "$PWD/.venv/bin/python" -m pytest -q -ra
